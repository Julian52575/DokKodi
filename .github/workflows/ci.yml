name: ci

on:
  push:
    branches: [main]
    # Only on push: a required check filtered out of a PR would hang as "expected".
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/rulesets/**"
      - ".sast/report/**"
  pull_request:
  workflow_dispatch: # allow a manual re-run from the Actions tab

# Least privilege: this workflow only needs to read the repo contents.
permissions:
  contents: read

# Cancel superseded runs for the same PR (or branch). Runs on `main` are left
# alone -- we want every push to `main` to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs have something to check. On a pull request, only the
  # areas whose files changed run; the others are skipped (ci-required accepts
  # a skip, never a failure). Pushes to main and manual runs check everything.
  #
  #   node (desktop)  desktop/ outside src-tauri/   (the React frontend)
  #   node (mobile)   mobile/
  #   rust (desktop)  desktop/src-tauri/ and any *.rs
  #   devshell        flake, nix/, justfile, .env.example, the setup action
  #   workflows       .github/
  #   audit           lockfiles
  #
  # A change to this file runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node_apps: ${{ steps.filter.outputs.node_apps }}
      desktop_rust: ${{ steps.filter.outputs.desktop_rust }}
      devshell: ${{ steps.filter.outputs.devshell }}
      workflows: ${{ steps.filter.outputs.workflows }}
      audit: ${{ steps.filter.outputs.audit }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base with the target branch
          persist-credentials: false

      - name: Filter by changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed.txt
          else
            echo ".github/workflows/ci.yml" > changed.txt
          fi
          # yes <pattern> [exclude-pattern]: true when a changed file matches.
          yes() {
            if [ "$all" = true ]; then echo true; return; fi
            if grep -E "$1" changed.txt | grep -Evq "${2:-^$}"; then echo true; else echo false; fi
          }
          all=false
          if grep -Eq '^\.github/workflows/ci\.yml$' changed.txt; then all=true; fi

          desktop_node=$(yes '^desktop/' '^desktop/src-tauri/')
          mobile_node=$(yes '^mobile/')
          desktop_rust=$(yes '^desktop/src-tauri/|\.rs$')
          devshell=$(yes '^(flake\.nix|flake\.lock|nix/|justfile$|\.env\.example$|\.github/actions/)')
          workflows=$(yes '^\.github/')
          audit=$(yes '(^|/)(package-lock\.json|Cargo\.lock)$')

          apps=()
          [ "$desktop_node" = true ] && apps+=('"desktop"')
          [ "$mobile_node" = true ] && apps+=('"mobile"')
          node_apps="[$(IFS=,; echo "${apps[*]:-}")]"

          {
            echo "node_apps=$node_apps"
            echo "desktop_rust=$desktop_rust"
            echo "devshell=$devshell"
            echo "workflows=$workflows"
            echo "audit=$audit"
          } >> "$GITHUB_OUTPUT"

          show() {
            if [ "$2" = true ]; then echo "| $1 | ✅ runs |"; else echo "| $1 | ⏭ skipped: no relevant change |"; fi
          }
          {
            echo "### Which jobs run"
            echo
            echo "| Area | Result |"
            echo "| --- | --- |"
            show "desktop frontend (node)" "$desktop_node"
            show "desktop backend (rust)" "$desktop_rust"
            show "mobile (node)" "$mobile_node"
            show "devshell" "$devshell"
            show "workflows (actionlint, zizmor)" "$workflows"
            show "dependency audit" "$audit"
          } >> "$GITHUB_STEP_SUMMARY"
  devshell:
    needs: changes
    if: needs.changes.outputs.devshell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git writes in this job; do not leave the token in .git/config.
          persist-credentials: false

      # Local composite action: check out first, then it installs Nix.
      # `nix flake check` below already evaluates the flake, so skip the warm.
      - uses: ./.github/actions/setup-devshell # zizmor: ignore[self-repository] -- actionlint rejects `$/`
        with:
          warm: "false"

      - name: Check the flake evaluates
        run: nix flake check --no-build --all-systems

      - name: Enter the dev shell and sanity-check tooling
        run: |
          nix develop --command bash -euo pipefail -c '
            just --list
            node --version
            cargo --version
          '

      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          icon='⚪'; [ "$STATUS" = success ] && icon='✅'; [ "$STATUS" = failure ] && icon='❌'
          {
            echo "### $icon devshell"
            echo
            echo "The flake evaluates and the dev shell starts: **$STATUS**."
          } >> "$GITHUB_STEP_SUMMARY"

  # Every workflow under .github/workflows, including a shellcheck pass on each
  # `run:` script (bundled in the actionlint image).
  workflow-lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint with actionlint 1.7.12
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          docker.io/rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          icon='⚪'; [ "$STATUS" = success ] && icon='✅'; [ "$STATUS" = failure ] && icon='❌'
          {
            echo "### $icon workflow-lint"
            echo
            echo "actionlint (with shellcheck on every \`run:\` script): **$STATUS**."
          } >> "$GITHUB_STEP_SUMMARY"

  # Security audit of every workflow and action; findings show as PR annotations.
  # Keep the version in sync with nix/zizmor.nix.
  zizmor:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }} # online audits (impostor commits, known-vulnerable actions)
        run: pipx run zizmor==1.31.1 --format github .github/

      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          icon='⚪'; [ "$STATUS" = success ] && icon='✅'; [ "$STATUS" = failure ] && icon='❌'
          {
            echo "### $icon zizmor"
            echo
            echo "Security audit of the workflows: **$STATUS**. Findings are annotated on the changed files."
          } >> "$GITHUB_STEP_SUMMARY"

  # Software-composition analysis of THIS branch: osv-scanner finds every
  # lockfile in the repo (npm, pip, go, cargo, maven, ...) and checks it
  # against the OSV database, so it needs no per-language setup.
  #
  # Gate: fails on any Critical or High advisory (CVSS >= 7), on 5 or more
  # Moderate+Low, or when the scan cannot complete -- an unknown posture is not
  # a passing one. No lockfile at all passes. Advisories without a CVSS score
  # count as Moderate. Counts and advisories land in the job summary and the
  # raw report uploads as an artifact, pass or fail.
  dependencies-audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan lockfiles with osv-scanner 2.7.0
        run: |
          set -uo pipefail
          mkdir -p dependency-audit
          raw=dependency-audit/osv.json

          rc=0
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 \
            scan source -r --format json . > "$raw" || rc=$?
          # 0 = clean, 1 = advisories found, 128 = no lockfile; anything else failed.
          case "$rc" in
            128)
              echo "### Dependency audit: no lockfile found -- nothing to scan" >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            0 | 1) ;;
            *)
              echo "::error::osv-scanner failed (exit $rc) -- an unknown posture cannot clear the gate"
              exit 1 ;;
          esac

          # One row per advisory group: severity bucket, package, lockfile, ids.
          jq -r '
            .results[]? | .source.path as $src | .packages[]? | .package as $p | .groups[]?
            | (.max_severity // "" | if . == "" then 5 else tonumber end) as $s
            | [ (if $s >= 9 then "critical" elif $s >= 7 then "high" elif $s >= 4 then "moderate" else "low" end),
                "\($p.ecosystem)/\($p.name)@\($p.version)", ($src | sub("^/repo/"; "")), (.ids | join(" ")) ]
            | @tsv' "$raw" > dependency-audit/rows.tsv

          count() { awk -F'\t' -v k="$1" '$1 == k' dependency-audit/rows.tsv | wc -l; }
          crit=$(count critical); high=$(count high); mod=$(count moderate); low=$(count low)
          ch=$((crit + high)); ml=$((mod + low))

          {
            echo "### Dependency audit (osv-scanner)"
            echo
            echo "| Critical | High | Moderate | Low |"
            echo "| --- | --- | --- | --- |"
            echo "| $crit | $high | $mod | $low |"
            echo
            echo "**Gate:** any Critical or High fails; 5 or more Moderate+Low fails."
            echo
            echo "<details><summary>Advisories</summary>"
            echo
            echo "| Severity | Package | Lockfile | Advisory |"
            echo "| --- | --- | --- | --- |"
            awk -F'\t' '{ printf "| %s | `%s` | `%s` | %s |\n", $1, $2, $3, $4 }' dependency-audit/rows.tsv
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          if [ "$ch" -gt 0 ]; then
            echo "::error::${crit} critical + ${high} high dependency advisories (allowed: 0) -- see the job summary"
            fail=1
          fi
          if [ "$ml" -ge 5 ]; then
            echo "::error::${ml} moderate + low dependency advisories (allowed: fewer than 5) -- see the job summary"
            fail=1
          fi
          exit "$fail"

      - name: Upload the raw audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: dependency-audit
          if-no-files-found: ignore

  # Lint, type-check and build each JavaScript app in its own folder.
  node:
    needs: changes
    if: needs.changes.outputs.node_apps != '[]'
    name: node (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.node_apps) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Test with coverage
        run: |
          set -o pipefail
          npm test --if-present 2>&1 | tee ../test.log
      - name: Type-check and build the desktop frontend
        if: matrix.app == 'desktop'
        run: npm run build
      - name: Type-check the mobile app
        if: matrix.app == 'mobile'
        run: npx tsc --noEmit
      # Bundles the JavaScript for Android without needing the Android SDK.
      - name: Export the Android bundle
        if: matrix.app == 'mobile'
        run: npx expo export --platform android

      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          APP: ${{ matrix.app }}
        working-directory: .
        run: |
          icon='⚪'; [ "$STATUS" = success ] && icon='✅'; [ "$STATUS" = failure ] && icon='❌'
          {
            echo "### $icon node ($APP)"
            echo
            echo "Lint, type-check and tests: **$STATUS**."
            echo
            if [ -s test.log ]; then
              echo '```'
              sed -E 's/\x1b\[[0-9;]*m//g' test.log | grep -E '^ *(Test Files|Tests|Test Suites)|^(Statements|Branches|Functions|Lines)|^All files' || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The Tauri backend: format, lint and test the Rust crate. The frontend is
  # built first because tauri::generate_context! embeds ../dist.
  rust:
    name: rust (desktop)
    needs: changes
    if: needs.changes.outputs.desktop_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the first apt install is slow; later runs reuse its cache
    env:
      CARGO_INCREMENTAL: "0" # a CI build starts clean; incremental data only bloats the cache
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The WebKit -dev closure is the slow part, so keep the downloaded .deb
      # files. Bump the v1 in the key to force a refresh. A cache saved on main
      # is readable by every PR; one saved inside a PR only by that PR.
      - name: Restore the apt downloads
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-libwebkit2gtk-4.1-dev-v1

      # Compiling needs only this -dev package: it depends on GTK 3, libsoup 3,
      # GLib, Cairo, Pango and D-Bus. librsvg is for bundling and nothing in
      # Cargo.lock needs OpenSSL.
      - name: Install the Tauri system libraries
        working-directory: .
        run: |
          # Refresh the Ubuntu archive only: the runner's other sources (Microsoft,
          # Azure, Chrome, ...) make a full update slow and are not needed here.
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=/dev/null \
            -o APT::Get::List-Cleanup=0
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-archives" \
            libwebkit2gtk-4.1-dev
          sudo chown -R "$USER" "$HOME/apt-archives"

      - name: Save the apt downloads
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-libwebkit2gtk-4.1-dev-v1

      # clippy (check) and test (build) cannot share compiled artifacts, but
      # both reuse the dependencies compiled by an earlier run. A PR with a
      # new Cargo.lock starts from main's closest cache.
      - name: Restore the Cargo build
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci
      - run: npm run build
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - name: cargo test
        working-directory: desktop/src-tauri
        run: |
          set -o pipefail
          cargo test 2>&1 | tee ../../rust-test.log

      # Saved even when a test failed: the compiled dependencies are still good.
      - name: Save the Cargo build
        if: "!cancelled() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Job summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        working-directory: .
        run: |
          icon='⚪'; [ "$STATUS" = success ] && icon='✅'; [ "$STATUS" = failure ] && icon='❌'
          {
            echo "### $icon rust (desktop)"
            echo
            echo "Format (\`cargo fmt\`), lint (\`clippy\`) and tests: **$STATUS**."
            echo
            if [ -s rust-test.log ]; then
              echo '```'
              grep -E '^test result' rust-test.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Single stable check for the branch ruleset to require.
  # Add a job to `needs` here to make it mandatory to the branch ruleset.
  ci-required:
    if: always()
    needs:
      - changes
      - devshell
      - workflow-lint
      - zizmor
      - node
      - rust
      - dependencies-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### CI result"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then "✅ passed" elif .value.result == "failure" then "❌ failed" else "⚪ " + .value.result end) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          # A job skipped because nothing it checks changed is fine; a failure,
          # a cancellation or a failed `changes` job fails the gate.
          if printf '%s\n' "$RESULTS" | tr ' ' '\n' | grep -vqxE 'success|skipped'; then
            echo "a required job did not succeed: $RESULTS"
            exit 1
          fi
